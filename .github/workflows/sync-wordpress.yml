name: Sync blog to WordPress

on:
  push:
    branches:
      - main
    paths:
      - "blog/**/*.md"
      - "scripts/sync_wordpress.py"
      - "scripts/requirements-wordpress.txt"
      - ".github/workflows/sync-wordpress.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civic-forensics-wordpress-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-wordpress.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-wordpress.txt

      - name: Select Markdown files
        id: files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            find blog -type f -name '*.md' -print0 > /tmp/wp-files
          else
            git diff --name-only -z "${{ github.event.before }}" "${{ github.sha }}" -- 'blog/*.md' 'blog/**/*.md' > /tmp/wp-files
          fi

          count=$(tr -cd '\0' < /tmp/wp-files | wc -c)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Selected $count Markdown file(s)."

      - name: Synchronize posts
        if: steps.files.outputs.count != '0'
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < /tmp/wp-files
          python scripts/sync_wordpress.py "${files[@]}"

      - name: No blog files changed
        if: steps.files.outputs.count == '0'
        run: echo "No Markdown blog files were selected for synchronization."
