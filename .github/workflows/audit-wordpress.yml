name: Audit WordPress content

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_wordpress_posts.py"
      - ".github/workflows/audit-wordpress.yml"

permissions:
  contents: write

concurrency:
  group: wordpress-content-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Audit WordPress posts
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
        run: python scripts/audit_wordpress_posts.py

      - name: Commit audit report
        run: |
          if [ -z "$(git status --porcelain -- reports/wordpress-content-audit.json reports/wordpress-content-audit.md)" ]; then
            echo "No report changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/wordpress-content-audit.json reports/wordpress-content-audit.md
          git commit -m "Update WordPress content audit"
          git push
